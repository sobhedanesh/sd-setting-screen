<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صبح دانش</title>
  
    <!-- فونت لاله‌زار -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap">
  
    <!-- آیکون‌های Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Lalezar', cursive;
            background: linear-gradient(to bottom, #000000, #1f8b1f);
            min-height: 100vh;
            color: white;
            direction: rtl;
            text-align: right;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 100%;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }
        .upload-label {
            display: block;
            text-align: center;
            margin: 15px 0 25px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
        }
        input[type="text"],
        input[type="email"],
        input[type="file"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Lalezar', cursive;
            font-size: 20px;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Lalezar', cursive;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .main-page {
            display: none;
            width: 100%;
        }
        .top-rect {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .profile-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }
        .default-profile {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .username {
            font-size: 26px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .option-btn {
            display: flex;
            align-items: center;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
        }
        .option-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .glass-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .option-text {
            font-size: 23px;
            flex-grow: 1;
            text-align: right;
        }
        .content-text {
            font-size: 19px;
            line-height: 2.2;
        }
        .content-box {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .content-box strong {
            display: block;
            margin-bottom: 8px;
            font-size: 21px;
        }
        .email-text {
            font-size: 20px;
            direction: ltr;
            text-align: center;
            unicode-bidi: embed;
        }
        /* استایل برای بخش انگلیسی در صفحه راست‌چین */
        .english-section {
            direction: ltr;
            text-align: left;
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 15px;
        }
        .english-section .content-box {
            direction: ltr;
            text-align: left;
        }
        .english-section strong {
            font-family: 'Lalezar', cursive; /* برای هماهنگی ظاهری */
        }
    </style>
</head>
<body>
    <!-- فرم ثبت نام / ویرایش -->
    <div id="registerForm" class="glass">
        <h2>خوش آمدی!</h2>
        <p style="text-align:center; margin-bottom:20px; font-size:18px;">لطفاً اطلاعات خود را وارد کن</p>
        <input type="text" id="userName" placeholder="نام و نام خانوادگی" required>
        <input type="email" id="userEmail" placeholder="ایمیل (اختیاری)">
      
        <label class="upload-label">این قسمت آپلود عکس پروفایل است</label>
        <input type="file" id="userPhoto" accept="image/*">
        
        <button onclick="saveProfile()">ثبت و ورود</button>
    </div>

    <!-- صفحه اصلی -->
    <div id="mainPage" class="main-page">
        <div class="glass top-rect" id="profileSection">
            <div class="default-profile" id="defaultIcon">
                <span class="material-icons">person</span>
            </div>
            <img id="profileImage" class="profile-img" style="display:none;">
            <div class="username" id="displayName">کاربر</div>
        </div>
        <div class="glass options-container">
            <div class="option-btn" onclick="openEdit()">
                <div class="glass-icon">
                    <span class="material-icons">edit</span>
                </div>
                <div class="option-text">ویرایش پروفایل</div>
            </div>
            <div class="option-btn" onclick="showAbout()">
                <div class="glass-icon">
                    <span class="material-icons">info</span>
                </div>
                <div class="option-text">درباره برنامه</div>
            </div>
            <div class="option-btn" onclick="showFAQ()">
                <div class="glass-icon">
                    <span class="material-icons">help_outline</span>
                </div>
                <div class="option-text">سوالات متداول</div>
            </div>
            <div class="option-btn" onclick="showSupport()">
                <div class="glass-icon">
                    <span class="material-icons">support_agent</span>
                </div>
                <div class="option-text">پشتیبانی</div>
            </div>
            <div class="option-btn" onclick="showPrivacy()">
                <div class="glass-icon">
                    <span class="material-icons">lock</span>
                </div>
                <div class="option-text">حفظ حریم‌خصوصی</div>
            </div>
        </div>
    </div>

    <!-- صفحات محتوا -->
    <div id="contentPage" class="glass main-page" style="display:none;">
        <h2 id="contentTitle" style="text-align:center; margin-bottom:20px;"></h2>
        <div id="contentText" class="content-text"></div>
        <button onclick="backToMain()" style="margin-top:30px;">برگشت</button>
    </div>

    <script>
        window.onload = function() {
            try {
                const savedName = localStorage.getItem('userName');
                const savedPhoto = localStorage.getItem('userPhoto');
                const savedEmail = localStorage.getItem('userEmail');
                if (savedName) {
                    document.getElementById('displayName').textContent = savedName;
                    if (savedPhoto) {
                        document.getElementById('profileImage').src = savedPhoto;
                        document.getElementById('profileImage').style.display = 'block';
                        document.getElementById('defaultIcon').style.display = 'none';
                    }
                    document.getElementById('registerForm').style.display = 'none';
                    document.getElementById('mainPage').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('mainPage').style.display = 'none';
            }
        };

        function saveProfile() {
            const name = document.getElementById('userName').value.trim();
            if (!name) {
                alert('لطفاً نام خود را وارد کنید!');
                return;
            }

            document.getElementById('displayName').textContent = name;
            const photoInput = document.getElementById('userPhoto');
            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        localStorage.setItem('userPhoto', e.target.result);
                    } catch (err) {}
                    document.getElementById('profileImage').src = e.target.result;
                    document.getElementById('profileImage').style.display = 'block';
                    document.getElementById('defaultIcon').style.display = 'none';
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                document.getElementById('defaultIcon').style.display = 'flex';
            }

            const email = document.getElementById('userEmail').value.trim();
            try {
                localStorage.setItem('userName', name);
                if (email) localStorage.setItem('userEmail', email);
            } catch (e) {}

            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('mainPage').style.display = 'block';
        }

        function openEdit() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            try {
                document.getElementById('userName').value = localStorage.getItem('userName') || '';
                document.getElementById('userEmail').value = localStorage.getItem('userEmail') || '';
            } catch (e) {
                document.getElementById('userName').value = document.getElementById('displayName').textContent;
                document.getElementById('userEmail').value = '';
            }
        }

        function showAbout() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('contentPage').style.display = 'block';
            document.getElementById('contentTitle').textContent = 'درباره برنامه';
            document.getElementById('contentText').innerHTML = `
                <div class="content-box">
                    صبح دانش یک هوش مصنوعی پیشرفته و هوشمند است<br>
                    که توسط دانش‌آموزان و معلمان مدرسه صبح دانش تهران ساخته شده.<br><br>
                    
                    هدف ما از ساخت این هوش مصنوعی، کمک به یادگیری بهتر<br>
                    و آسان‌تر دانش‌آموزان در سراسر ایران است.<br><br>
                    
                    صبح دانش می‌تواند به سوالات درسی شما پاسخ دهد،<br>
                    مسائل ریاضی را حل کند، متن‌های ادبی را توضیح دهد<br>
                    و حتی در پروژه‌های تحقیقاتی کنار شما باشد.<br><br>
                    
                    این برنامه کاملاً رایگان است و هیچ هزینه‌ای ندارد.<br>
                    ما معتقدیم آموزش باکیفیت باید برای همه در دسترس باشد.<br><br>
                    
                    تیم توسعه‌دهنده ما همیشه در حال بهبود و افزودن قابلیت‌های جدید است<br>
                    تا تجربه بهتری برای شما فراهم کنیم.<br><br>
                    
                    از اینکه صبح دانش را انتخاب کردید، سپاسگزاریم!
                </div>
            `;
        }

        function showFAQ() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('contentPage').style.display = 'block';
            document.getElementById('contentTitle').textContent = 'سوالات متداول';
            document.getElementById('contentText').innerHTML = `
                <div class="content-box">
                    <strong>۱. آیا استفاده از صبح دانش هزینه دارد؟</strong> خیر! صبح دانش کاملاً رایگان است و همیشه خواهد بود.
                </div>
                <div class="content-box">
                    <strong>۲. آیا نیاز به ثبت نام دارد؟</strong> فقط یک بار برای شخصی‌سازی پروفایل ثبت نام می‌کنید، اما بدون آن هم می‌توانید استفاده کنید.
                </div>
                <div class="content-box">
                    <strong>۳. آیا اطلاعات من امن است؟</strong> بله، اطلاعات شما فقط روی دستگاه خودتان ذخیره می‌شود و به هیچ سروری ارسال نمی‌شود.
                </div>
                <div class="content-box">
                    <strong>۴. صبح دانش چه موضوعاتی را پشتیبانی می‌کند؟</strong> همه دروس مدرسه، ریاضی، فیزیک، شیمی، ادبیات، زبان انگلیسی و خیلی موضوعات دیگر.
                </div>
            `;
        }

        function showSupport() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('contentPage').style.display = 'block';
            document.getElementById('contentTitle').textContent = 'پشتیبانی';
            document.getElementById('contentText').innerHTML = `
                <div class="content-box">
                    اگر سوال، پیشنهاد یا مشکلی دارید، با ما در ارتباط باشید:
                </div>
                <div class="content-box">
                    <strong>ایمیل:</strong><br>
                    <span class="email-text">arshammajidi168@gmail.com</span>
                </div>
                <div class="content-box">
                    <strong>تلفن:</strong><br>
                    ۰۹۰۳۹۳۰۴۴۶۴
                </div>
                <div class="content-box">
                    معمولاً در کمتر از ۲۴ ساعت به پیام‌های شما پاسخ می‌دهیم.
                </div>
            `;
        }

        function showPrivacy() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('contentPage').style.display = 'block';
            document.getElementById('contentTitle').textContent = 'حریم خصوصی و امنیت';
            
            // متن جدید حریم خصوصی (فارسی + انگلیسی)
            const privacyText = `
                <div class="content-box">
                    <strong>حریم خصوصی و امنیت در اپلیکیشن هوش مصنوعی صبح دانش</strong><br><br>
                    حریم خصوصی کاربران برای ما اولویت اول است. این متن به زبان ساده توضیح می‌دهد که چه اطلاعاتی جمع‌آوری می‌شود، چرا و چگونه از آن محافظت می‌کنیم.
                    <br><br>
                    <strong>۱. چه اطلاعاتی جمع‌آوری می‌شود؟</strong><br>
                    - اطلاعاتی که شما مستقیماً ارائه می‌دهید (مانند نام، ایمیل، شماره تلفن).<br>
                    - اطلاعات استفاده از اپلیکیشن (مانند مکالمات با هوش مصنوعی، صفحات بازدید شده).<br>
                    - اطلاعات فنی دستگاه (مدل گوشی، سیستمعامل، شناسه منحصربه‌فرد دستگاه).
                    <br><br>
                    <strong>۲. چرا این اطلاعات را جمع‌آوری می‌کنیم؟</strong><br>
                    - برای ارائه و بهبود پاسخ‌های هوش مصنوعی.<br>
                    - برای پشتیبانی و ارتباط با شما.<br>
                    - برای افزایش امنیت و جلوگیری از سوءاستفاده.
                    <br><br>
                    <strong>۳. امنیت اطلاعات</strong><br>
                    تمام داده‌ها با پروتکل رمزنگاری شده (مانند TLS) منتقل می‌شوند. سرورهای ما دارای حفاظت فیزیکی و نرم‌افزاری هستند. دسترسی به اطلاعات فقط برای افراد مجاز و تحت قوانین سختگیرانه است.
                    <br><br>
                    <strong>۴. اشتراک‌گذاری با شخص ثالث</strong><br>
                    اطلاعات شخصی شما را بدون رضایت شما نمی‌فروشیم یا به اشتراک نمی‌گذاریم، مگر در موارد قانونی (مثلاً حکم دادگاه) یا برای عملکرد سرویس (مانند میزبانی سرور).
                    <br><br>
                    <strong>۵. نگهداری و حذف داده‌ها</strong><br>
                    اطلاعات تا زمانی که حساب کاربری دارید یا برای اهداف قانونی نیاز باشد، نگهداری می‌شود. شما می‌توانید درخواست حذف حساب و اطلاعات خود را ارسال کنید.
                    <br><br>
                    <strong>۶. حقوق شما</strong><br>
                    شما حق دارید:<br>
                    - از نوع داده‌های ذخیره‌شده مطلع شوید.<br>
                    - خروج از بازاریابی ایمیلی را درخواست کنید.<br>
                    - درخواست تصحیح یا حذف اطلاعات خود را بدهید.
                    <br><br>
                    <strong>۷. تغییرات در این متن</strong><br>
                    در صورت تغییر قابل توجه، از طریق ایمیل یا داخل اپلیکیشن به شما اطلاع خواهیم داد.
                    <br><br>
                    <strong>تماس با ما</strong><br>
                    آدرس ایمیل پشتیبانی: arshammajidi168@gmail.com
                </div>
                
                <div class="english-section">
                    <div class="content-box">
                        <strong>Privacy & Security Policy for Sobhedanesh AI</strong><br><br>
                        User privacy is our top priority. This policy explains what data we collect, why we collect it, and how we protect it.
                        <br><br>
                        <strong>1. What Data We Collect</strong><br>
                        - Information you provide directly (e.g., name, email, phone number).<br>
                        - Usage data (e.g., conversations with AI, pages visited).<br>
                        - Device information (model, OS version, unique device ID).
                        <br><br>
                        <strong>2. Why We Collect Data</strong><br>
                        - To operate and improve AI responses.<br>
                        - To provide customer support and respond to inquiries.<br>
                        - To enhance security, prevent fraud, and enforce terms of service.
                        <br><br>
                        <strong>3. Data Security</strong><br>
                        All data is transmitted over encrypted protocols (TLS). Our servers have physical and software protection. Access is restricted to authorized personnel under strict policies.
                        <br><br>
                        <strong>4. Third-Party Sharing</strong><br>
                        We never sell your personal data. We may share it only:<br>
                        - With your explicit consent.<br>
                        - For legal reasons (e.g., court order).<br>
                        - With trusted service providers (e.g., cloud hosting) who follow strict confidentiality.
                        <br><br>
                        <strong>5. Data Retention & Deletion</strong><br>
                        We keep your data as long as you have an active account or as required by law. You can request account and data deletion anytime.
                        <br><br>
                        <strong>6. Your Rights</strong><br>
                        You have the right to:<br>
                        - Know what data we store about you.<br>
                        - Opt out of email marketing.<br>
                        - Request correction or deletion of your data.
                        <br><br>
                        <strong>7. Changes to This Policy</strong><br>
                        We will notify you of significant changes via email or in-app message.
                        <br><br>
                        <strong>Contact Us</strong><br>
                        Email: arshammajidi168@gmail.com
                    </div>
                </div>
            `;
            
            document.getElementById('contentText').innerHTML = privacyText;
        }

        function backToMain() {
            document.getElementById('contentPage').style.display = 'none';
            try {
                if (localStorage.getItem('userName')) {
                    document.getElementById('mainPage').style.display = 'block';
                } else {
                    document.getElementById('registerForm').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('registerForm').style.display = 'block';
            }
        }
    </script>
</body>
</html>
